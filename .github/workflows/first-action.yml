name: Spring Boot Unit Tests
on: [push,workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Set Up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Run Spring Boot Tests
        run: mvn test
  deploy:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Get Code
          uses: actions/checkout@v3
        - name: Set Up JDK 22
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '22'
            cache: maven
        - name: Build Project
          run: mvn -B clean package


