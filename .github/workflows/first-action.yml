name: Spring Boot CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - 'dev-*'
      - 'feat/**'

  push:
    branches:
      - main
      - 'dev-*'
      - 'feat/**'
    paths-ignore:
      - '.github/workflows/*'

  workflow_dispatch:

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21, 22]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile Project
        run: mvn clean compile


  test:
    name: Run Unit Tests
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21, 22]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Execute Tests
        run: mvn test


  package:
    name: Package JAR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Build JAR
        run: mvn clean install -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-artifact
          path: target/*.jar


  deploy:
    name: Deploy to Production
    needs: package
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'

    environment:
      name: production

    concurrency:
      group: production-deployment
      cancel-in-progress: true

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: springboot-artifact

      - name: Verify Files
        run: ls -l

      - name: Deploy Application
        run: echo "Application deployed successfully"